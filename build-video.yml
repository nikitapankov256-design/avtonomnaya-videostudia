name: Собрать ролик
on:
  workflow_dispatch:
  push:
    paths:
      - 'content/**'
      - 'build_video.py'
      - '.github/workflows/build-video.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Установить бесплатные инструменты
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          pip install pillow
      - name: Собрать видео
        run: python build_video.py
      - name: Сохранить MP4 как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: autopartner-promo-video
          path: autopartner_promo.mp4
          if-no-files-found: error
