name: Собрать За закрытой дверью — серия 1
on:
  workflow_dispatch:
  push:
    paths:
      - 'series1/**'
      - '.github/workflows/series1.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Установить инструменты
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
          python -m pip install --upgrade pip
          pip install pillow edge-tts
      - name: Создать озвучку и сцены
        run: python series1/make_episode.py
      - name: Проверить MP4
        run: |
          test -s output/za_zakrytoy_dveryu_ep01.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/za_zakrytoy_dveryu_ep01.mp4
      - name: Загрузить готовое видео
        uses: actions/upload-artifact@v4
        with:
          name: za-zakrytoy-dveryu-episode-01
          path: output/za_zakrytoy_dveryu_ep01.mp4
          if-no-files-found: error
