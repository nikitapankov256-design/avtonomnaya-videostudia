name: Video build watchdog

on:
  workflow_run:
    workflows: ["Собрать рисованный мультфильм"]
    types: [completed]

permissions:
  actions: write
  issues: write

jobs:
  retry-transient-failure:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Повторить неудачные задания (не более двух повторов)
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            core.warning(`Build failed on attempt ${run.run_attempt}; requesting retry for run ${run.id}.`);
            await github.request(
              'POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun-failed-jobs',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              }
            );

  report-exhausted-failure:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt >= 3
    runs-on: ubuntu-latest
    steps:
      - name: Сообщить о трёх неудачных попытках
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = 'Сборка видео остановлена после 3 неудачных попыток';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            if (existing.data.some(issue => issue.title === title)) {
              core.info('An open failure report already exists.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                'Автоматический контролёр исчерпал лимит повторных запусков.',
                '',
                `Последняя сборка: ${run.html_url}`,
                `Попытка: ${run.run_attempt}`,
                `Причина: ${run.conclusion}`,
                '',
                'Нужен разбор логов и исправление исходной причины. Повторные запуски без изменения кода не будут выполняться бесконечно.'
              ].join('\n')
            });
