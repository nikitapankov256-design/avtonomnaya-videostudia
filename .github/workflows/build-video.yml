name: Собрать рисованный мультфильм

on:
  workflow_dispatch:
  push:
    paths:
      - 'content/**'
      - 'build_video.py'
      - '.github/workflows/build-video.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Установить бесплатные инструменты
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install pillow piper-tts
      - name: Скачать русскую голосовую модель Piper
        run: |
          mkdir -p voices
          curl -L --fail --retry 3 -o voices/ru_RU-irina-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx
          curl -L --fail --retry 3 -o voices/ru_RU-irina-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx.json
          curl -L --fail --retry 3 -o voices/ru_RU-dmitri-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/dmitri/medium/ru_RU-dmitri-medium.onnx
          curl -L --fail --retry 3 -o voices/ru_RU-dmitri-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/dmitri/medium/ru_RU-dmitri-medium.onnx.json
      - name: Собрать анимированный ролик
        run: python build_video.py
      - name: Опубликовать MP4 как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: animated-explainer-no-brand
          path: autopromo_explainer.mp4
          if-no-files-found: error
