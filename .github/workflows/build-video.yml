name: Собрать рисованный мультфильм

on:
  workflow_dispatch:
  push:
    paths:
      - 'content/**'
      - 'build_video.py'
      - '.github/workflows/build-video.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Установить бесплатные инструменты
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          if ! fc-match "DejaVu Sans" >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y fonts-dejavu-core
          fi
          pip install pillow edge-tts
      - name: Собрать анимированный ролик
        run: python build_video.py
      - name: Опубликовать MP4 как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: animated-explainer-no-brand
          path: autopromo_explainer.mp4
          if-no-files-found: error
